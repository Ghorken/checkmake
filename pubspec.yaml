name: checkmake
description: CheckMake - Build your army. Break the king.
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  audioplayers: ^6.6.0
  lottie: ^3.3.2
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    # PLACEHOLDER IMAGES - Sostituisci con i tuoi asset reali
    # Struttura attesa per i pezzi:
    # assets/images/pieces/{piece_id}_full.png  -> immagine a vita piena
    # assets/images/pieces/{piece_id}_half.png  -> immagine a metà vita
    # piece_id examples: pawn, rook, knight, bishop, queen, king
    # per pezzi nuovi: fighter, miner, rifleman, healer, etc.
    - assets/images/pieces/
    - assets/images/buildings/
    - assets/images/terrains/
    - assets/icons/
    - assets/icon.png
    - assets/splash.png
    - assets/privacy/
  # fonts:
    # Puoi aggiungere font custom qui
    # - family: MedievalFont
    #   fonts:
    #     - asset: assets/fonts/medieval.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png
  android: true
  ios: true
  web: true
